name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kiểm tra & đóng gói
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Kiểm tra cấu trúc extension
        run: npm run check

      - name: Đóng gói extension
        run: npm run ext:zip

      - uses: actions/upload-artifact@v7
        with:
          name: bo-cong-cu-extension
          path: dist/*.zip
          retention-days: 14
