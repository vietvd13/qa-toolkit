<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ công cụ</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="hub.css">
<script src="shared/theme.js"></script>
</head>
<body>
<a class="skip" href="#main">Bỏ qua tới nội dung chính</a>
<div class="hub" id="hub">
  <!-- Rail: bảng tên máy · tìm nhanh · các kênh công cụ · hàng cài đặt -->
  <aside class="rail" id="side" aria-label="Điều hướng">
    <div class="rail-top">
      <a class="brand-link" href="#/" title="Bộ công cụ">
        <img class="brand-logo" src="icons/icon128.png" alt="">
        <span class="brand-txt nav-label"><span class="brand-name">Bộ công cụ</span><span class="ver" id="ver"></span></span>
      </a>
    </div>
    <button class="rail-find" type="button" id="btnFind" title="Tìm công cụ (Ctrl K)">
      <span class="ms" aria-hidden="true">search</span><span class="nav-label">Tìm công cụ</span><kbd class="rail-kbd nav-label" aria-hidden="true">Ctrl K</kbd>
    </button>
    <nav class="side-nav">
      <a class="nav-item" href="#/" data-id="" title="Tất cả công cụ">
        <span class="ms" aria-hidden="true">dashboard</span><span class="nav-label">Tất cả công cụ</span>
      </a>
      <div class="nav-sec nav-label" aria-hidden="true"><span>Kênh</span><span class="nav-count" id="navCount"></span></div>
      <div id="navTools" class="nav-list"></div>
    </nav>
    <div class="rail-foot">
      <button class="upd-card hidden" type="button" id="btnUpdate" aria-haspopup="dialog">
        <span class="ms" aria-hidden="true">upgrade</span>
        <span class="nav-label"><b id="updPillText">Bản mới</b><small>Xem cách cập nhật</small></span>
      </button>
      <div class="rail-tools">
        <button class="icon-btn" type="button" id="btnMode" aria-label="Chế độ màu"><span class="ms" aria-hidden="true">dark_mode</span></button>
        <button class="icon-btn" type="button" id="btnCheckUpdate" aria-haspopup="dialog" aria-label="Kiểm tra cập nhật" title="Kiểm tra cập nhật"><span class="ms" aria-hidden="true">sync</span></button>
        <a class="icon-btn" href="https://github.com/vietvd13/qa-toolkit" target="_blank" rel="noopener" aria-label="Mã nguồn trên GitHub (mở tab mới)" title="Mã nguồn trên GitHub"><span class="ms" aria-hidden="true">code</span></a>
        <span class="spacer"></span>
        <button class="icon-btn rail-collapse" type="button" id="btnCollapse" aria-label="Thu gọn thanh bên" aria-controls="side" aria-expanded="true">
          <span class="ms" aria-hidden="true">left_panel_close</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Nội dung -->
  <main class="main" id="main" tabindex="-1">
    <section class="home" id="home">
      <div class="home-in">
        <header class="home-head">
          <p class="eyebrow" id="homeEyebrow">Bộ công cụ QA</p>
          <h1>Tất cả công cụ</h1>
          <p class="lead" id="lead"></p>
          <div class="top-search" role="search">
            <span class="ms" aria-hidden="true">search</span>
            <input type="search" id="q" placeholder="Tìm công cụ theo tên, việc cần làm…" aria-label="Tìm công cụ" autocomplete="off" spellcheck="false">
            <kbd class="kbd" aria-hidden="true">Ctrl K</kbd>
          </div>
        </header>
        <div class="cats" id="cats" role="toolbar" aria-label="Lọc theo nhóm"></div>
        <div class="tool-grid" id="toolGrid"></div>
        <div class="empty hidden" id="noTools">
          <span class="ms lg" aria-hidden="true">search_off</span>
          <p>Không có công cụ nào khớp “<span id="noToolsQ"></span>”.</p>
          <button class="btn" type="button" id="btnClearSearch">Xoá tìm kiếm</button>
        </div>
      </div>
    </section>
    <div class="frames" id="frames"></div>
  </main>
</div>
<!-- Bảng cập nhật phiên bản -->
<div class="modal-bg hidden" id="updDlg">
  <div class="modal upd-modal" role="dialog" aria-modal="true" aria-labelledby="updTitle">
    <div class="modal-h">
      <div>
        <h3 id="updTitle">Cập nhật</h3>
        <div class="muted" id="updSub"></div>
      </div>
      <button class="x" type="button" data-close aria-label="Đóng"><span class="ms" aria-hidden="true">close</span></button>
    </div>
    <div class="modal-b" id="updBody" aria-live="polite"></div>
  </div>
</div>

<script src="tools/registry.js"></script>
<script src="hub.js"></script>
</body>
</html>
